<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Лимонад — ОтзывGo</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            background: #f4f1ea;
            color: #202020;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 460px;

            background: #fffdf9;

            border-radius: 32px;

            padding: 42px 26px 32px;

            text-align: center;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.10);
        }

        /* ЛОГОТИП */

        .logo {
            width: 100px;
            height: 100px;

            margin: 0 auto 22px;

            border-radius: 28px;

            background: #ffc83d;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 58px;
            font-weight: 800;

            color: #202020;

            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.08);
        }

        /* НАЗВАНИЕ */

        h1 {
            margin: 0;

            font-size: 38px;
            line-height: 1.1;

            font-weight: 800;
        }

        .address {
            margin-top: 12px;

            color: #777777;

            font-size: 17px;
            line-height: 1.4;
        }

        /* ПРИВЕТСТВИЕ */

        .message {
            margin-top: 42px;

            font-size: 25px;
            line-height: 1.25;

            font-weight: 800;
        }

        .heart {
            color: #ffc83d;
        }

        .description {
            margin: 14px auto 0;

            max-width: 370px;

            color: #777777;

            font-size: 18px;
            line-height: 1.45;
        }

        /* ЗВЁЗДЫ */

        .stars {
            margin-top: 28px;

            font-size: 42px;

            letter-spacing: 7px;

            color: #ffbf19;
        }

        /* ГЛАВНАЯ КНОПКА */

        .review-button {
            width: 100%;

            margin-top: 30px;

            border: none;

            border-radius: 20px;

            padding: 20px 18px;

            background: #202020;
            color: white;

            font-size: 19px;
            font-weight: 700;

            cursor: pointer;

            transition: 0.2s;
        }

        .review-button:hover {
            transform: translateY(-2px);
        }

        .review-button:active {
            transform: scale(0.98);
        }

        .button-star {
            color: #ffc400;
            margin-right: 8px;
        }

        /* ПЛОЩАДКИ */

        .platforms {
            display: none;

            margin-top: 14px;

            gap: 12px;
        }

        .platform {
            width: 100%;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 17px 18px;

            background: #fffdf9;

            border: 1px solid #e4e0d8;

            border-radius: 18px;

            text-decoration: none;

            color: #202020;

            font-size: 18px;

            font-weight: 700;

            transition: 0.2s;
        }

        .platform:hover {
            background: #f7f4ed;

            transform: translateY(-2px);
        }

        .platform-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .platform-icon {
            width: 38px;
            height: 38px;

            border-radius: 10px;

            display: flex;
align-items: center;
            justify-content: center;

            font-size: 18px;
            font-weight: 800;
        }

        .gis-icon {
            background: #19c542;
            color: white;
        }

        .yandex-icon {
            background: #ff3030;
            color: white;
        }

        .google-icon {
            background: #4285f4;
            color: white;
        }

        .arrow {
            color: #777;
            font-size: 25px;
        }

        /* NFC */

        .nfc-info {
            margin-top: 30px;

            display: flex;

            justify-content: center;
            align-items: center;

            gap: 12px;

            color: #999999;

            font-size: 15px;

            line-height: 1.4;
        }

        .nfc-icon {
            font-size: 30px;
        }

        /* БРЕНД */

        .brand {
            margin-top: 28px;

            color: #b1aea7;

            font-size: 14px;
            font-weight: 600;
        }

        /* ТЕЛЕФОН */

        @media (max-width: 500px) {

            body {
                padding: 12px;
            }

            .card {
                padding: 32px 20px 26px;

                border-radius: 28px;
            }

            .logo {
                width: 86px;
                height: 86px;

                font-size: 48px;

                border-radius: 24px;
            }

            h1 {
                font-size: 32px;
            }

            .message {
                font-size: 22px;
            }

            .description {
                font-size: 16px;
            }

            .stars {
                font-size: 35px;
                letter-spacing: 4px;
            }

            .review-button {
                font-size: 17px;
            }

            .platform {
                font-size: 16px;
            }
        }

    </style>

</head>


<body>


    <main class="card">


        <!-- ЛОГОТИП -->

        <div class="logo">
            Л
        </div>


        <!-- НАЗВАНИЕ -->

        <h1>
            Лимонад
        </h1>


        <!-- АДРЕС -->

        <div class="address">
            📍  Ключевская улица, 54В, Улан-Удэ
        </div>


        <!-- ПРИВЕТСТВИЕ -->

        <div class="message">

            Спасибо, что посетили нас!

            <span class="heart">
                ♥
            </span>

        </div>


        <p class="description">

            Нам важно ваше мнение.
            Оставьте отзыв
            на удобной для вас площадке.

        </p>


        <!-- ЗВЁЗДЫ -->

        <div class="stars">

            ★★★★★

        </div>


        <!-- КНОПКА -->

        <button
            class="review-button"
            onclick="showReviews()">

            <span class="button-star">
                ★
            </span>

            Оставить отзыв

        </button>


        <!-- ПЛОЩАДКИ -->

        <div
            class="platforms"
            id="platforms">


            <!-- 2ГИС -->

            <a
                class="platform"
                href="https://2gis.ru/ulanude/firm/70000001025438838"
                target="_blank"
                rel="noopener">

                <span class="platform-left">

                    <span class="platform-icon gis-icon">
                        2
                    </span>

                    <span>
                        2ГИС
                    </span>

                </span>

                <span class="arrow">
                    ›
                </span>

            </a>


            <!-- ЯНДЕКС -->

            <a
                class="platform"
                href="https://yandex.ru/maps/"
                target="_blank"
                rel="noopener">

                <span class="platform-left">

                    <span class="platform-icon yandex-icon">
                        Я
                    </span>

                    <span>
Яндекс Карты
                    </span>

                </span>

                <span class="arrow">
                    ›
                </span>

            </a>


            <!-- GOOGLE -->

            <a
                class="platform"
                href="https://www.google.com/maps/"
                target="_blank"
                rel="noopener">

                <span class="platform-left">

                    <span class="platform-icon google-icon">
                        G
                    </span>

                    <span>
                        Google
                    </span>

                </span>

                <span class="arrow">
                    ›
                </span>

            </a>


        </div>


        <!-- NFC / QR -->

        <div class="nfc-info">

            <span class="nfc-icon">
                ))) 
            </span>

            <span>
                Откройте страницу через NFC<br>
                или отсканируйте QR-код.
            </span>

        </div>


        <!-- БРЕНД -->

        <div class="brand">

            ОтзывGo

        </div>


    </main>


    <script>

        function showReviews() {

            const platforms =
                document.getElementById("platforms");

            platforms.style.display = "grid";

        }

    </script>


</body>

</html>
